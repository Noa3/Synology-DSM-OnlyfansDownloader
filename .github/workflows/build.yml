name: Build DSM package

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install worker dependencies for tests
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download and hash Linux wheels
        run: python tools/fetch_wheels.py
      - name: Build the SPK twice (reproducibility is checked by the test)
        run: python tools/build_spk.py
      - name: Run DSM tests
        run: |
          python -m unittest discover -s tests -p 'test_dsm_*.py'
      - name: Upload SPK
        uses: actions/upload-artifact@v4
        with:
          name: OnlyFansDL-r1000-dsm72
          path: |
            dist/*.spk
            dist/*.spk.sha256
