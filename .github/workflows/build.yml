name: Build DSM package

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install worker dependencies for tests
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download and hash Linux wheels
        run: python tools/fetch_wheels.py
      - name: Build the SPK twice (reproducibility is checked by the test)
        run: python tools/build_spk.py
      - name: Run DSM tests
        run: |
          python -m unittest \
            tests.test_dsm_security \
            tests.test_dsm_db \
            tests.test_dsm_jobs \
            tests.test_dsm_worker \
            tests.test_dsm_service \
            tests.test_dsm_package
      - name: Upload SPK
        uses: actions/upload-artifact@v4
        with:
          name: OnlyFansDL-r1000-dsm72
          path: |
            dist/*.spk
            dist/*.spk.sha256
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.spk
            dist/*.spk.sha256
          generate_release_notes: true
