<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnlyFans DL</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0b1017; color: #e8eef7; display: grid; place-items: center;
           min-height: 100vh; margin: 0; }
    .card { max-width: 480px; padding: 28px; border: 1px solid #243247;
            border-radius: 16px; background: #111924; }
    a { color: #45c4b0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OnlyFans DL</h1>
    <p>Die Oberfläche wird auf Port 8765 geöffnet …</p>
    <p><a id="fallback" href="#">Oberfläche öffnen</a></p>
  </div>
  <script>
    (function () {
      var url = 'http://' + location.hostname + ':8765/';
      document.getElementById('fallback').href = url;
      location.replace(url);
    })();
  </script>
</body>
</html>
